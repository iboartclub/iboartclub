<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBOARTCLUB TƏDRİS MƏRKƏZİ</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a192f">
    <style>
        :root {
            --primary-bg: #0a192f;
            --card-bg: #112240;
            --text-color: #e6f1ff;
            --accent-blue: #0056b3;
            --accent-gold: #ffd700;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--primary-bg);
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }

        .logo-container {
            margin: 30px 0;
        }

        .logo-text {
            font-family: 'Brush Script MT', cursive, sans-serif;
            font-size: 3rem;
            font-weight: bold;
            display: inline-block;
        }

        .logo-ibo-art {
            color: #0033aa;
        }

        .logo-club {
            color: #ffc107;
            vertical-align: sub;
        }

        h1 {
            color: var(--accent-gold);
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }

        .nav-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            padding: 15px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
            border: 1px solid var(--accent-blue);
        }

        .nav-btn:hover {
            transform: translateY(-3px);
            background-color: var(--accent-blue);
        }

        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: none;
            border: 2px solid var(--accent-gold);
            color: var(--text-color);
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: 0.3s;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--accent-gold);
            color: var(--primary-bg);
        }

        .tab-btn:first-child {
            border-radius: 20px 0 0 20px;
        }

        .tab-btn:last-child {
            border-radius: 0 20px 20px 0;
        }

        .form-section {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            text-align: left;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #233554;
            border-radius: 6px;
            background-color: var(--primary-bg);
            color: var(--text-color);
            box-sizing: border-box;
        }

        button.submit-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-gold);
            border: none;
            border-radius: 6px;
            color: var(--primary-bg);
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: filter 0.2s;
        }

        button.submit-btn:hover {
            filter: brightness(90%);
        }

        .social-container {
            margin-top: 30px;
        }

        .social-grid {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .social-icon {
            display: inline-block;
            padding: 10px 20px;
            background-color: var(--accent-blue);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .social-icon:hover {
            background-color: #004085;
        }

        .contact-box {
            margin-top: 30px;
            padding: 15px;
            background-color: rgba(255, 215, 0, 0.1);
            border-left: 4px solid var(--accent-gold);
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <div class="logo-text">
            <span class="logo-ibo-art">iboArt</span><span class="logo-club">Club</span>
        </div>
        <h1>TƏDRİS MƏRKƏZİ</h1>
    </div>

    <div class="contact-box">
        Əlaqə: <a href="tel:+99553181929" style="color: var(--accent-gold); font-weight: bold;">055 318 19 29</a>
    </div>

    <div class="nav-grid">
        <a href="#about" class="nav-btn">Haqqında</a>
        <a href="#registration" class="nav-btn">Qeydiyyat</a>
        <a href="#courses" class="nav-btn">Kurs Haqqında</a>
        <a href="#news" class="nav-btn">Xəbərlər</a>
    </div>

    <div id="registration">
        <h2>Qeydiyyat Forması</h2>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('abituriyent')">Abituriyent</button>
            <button class="tab-btn" onclick="switchTab('programming')">Proqramlaşdırma</button>
        </div>

        <div id="abituriyent-form" class="form-section active">
            <form onsubmit="handleSubmit(event, 'Abituriyent')">
                <div class="form-group"><label>Ad:</label><input type="text" required></div>
                <div class="form-group"><label>Soyad:</label><input type="text" required></div>
                <div class="form-group"><label>Ata adı:</label><input type="text" required></div>
                <div class="form-group"><label>Məktəbi:</label><input type="text" required></div>
                <div class="form-group"><label>Sinfi:</label><input type="text" required></div>
                <div class="form-group"><label>IX sinif riyaziyyat balı (Buraxılış imtahanı):</label><input type="number" min="0" max="100" required></div>
                <div class="form-group"><label>Valideyn ad və soyadı:</label><input type="text" required></div>
                <div class="form-group"><label>Valideyn əlaqə nömrəsi:</label><input type="tel" placeholder="0501234567" required></div>
                <button type="submit" class="submit-btn">Qeydiyyatdan Keç</button>
            </form>
        </div>

        <div id="programming-form" class="form-section">
            <form onsubmit="handleSubmit(event, 'Proqramlaşdırma')">
                <div class="form-group"><label>Ad:</label><input type="text" required></div>
                <div class="form-group"><label>Soyad:</label><input type="text" required></div>
                <div class="form-group"><label>Ata adı:</label><input type="text" required></div>
                <div class="form-group"><label>Məktəb və Sinif / Yaş:</label><input type="text" required></div>
                <div class="form-group">
                    <label>Maraqlandığınız İstiqamət:</label>
                    <select>
                        <option>Python Proqramlaşdırma</option>
                        <option>C++</option>
                        <option>Veb Sayt Hazırlanması (Frontend/Backend)</option>
                        <option>Olimpiada / İKT</option>
                    </select>
                </div>
                <div class="form-group"><label>Əlaqə nömrəsi:</label><input type="tel" placeholder="0501234567" required></div>
                <button type="submit" class="submit-btn">Qeydiyyatdan Keç</button>
            </form>
        </div>
    </div>

    <div class="social-container" id="social">
        <h3>Sosial Şəbəkə Hesablarımız</h3>
        <div class="social-grid">
            <a href="https://instagram.com/iboartclub" class="social-icon" target="_blank">Instagram</a>
            <a href="https://t.me/iboartclub" class="social-icon" target="_blank">Telegram</a>
            <a href="https://tiktok.com/@iboartclub" class="social-icon" target="_blank">TikTok</a>
            <a href="https://youtube.com/@iboartclub" class="social-icon" target="_blank">YouTube</a>
            <a href="https://facebook.com/iboartclub" class="social-icon" target="_blank">Facebook</a>
            <a href="https://whatsapp.com/channel/iboartclub" class="social-icon" target="_blank">WhatsApp Kanalı</a>
        </div>
    </div>
</div>

<script>
    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.form-section').forEach(section => section.classList.remove('active'));

        if(tabName === 'abituriyent') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('abituriyent-form').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('programming-form').classList.add('active');
        }
    }

    function handleSubmit(event, type) {
        event.preventDefault();
        alert(type + " bölməsi üzrə qeydiyyatınız uğurla qəbul olundu!");
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('PWA Registered'))
            .catch(err => console.log('PWA Registration Failed', err));
        });
    }
</script>
</body>
</html>
